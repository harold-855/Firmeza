services:
  # ==============================================================================
  # 1. PASO OBLIGATORIO: Pruebas Unitarias Automatizadas (Tests)
  # ==============================================================================
  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    container_name: firmeza-tests
    restart: "no"
    networks:
      - firmeza-network

  # ==============================================================================
  # 2. Base de Datos PostgreSQL
  # ==============================================================================
  firmeza-db:
    image: postgres:16-alpine
    container_name: firmeza-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: firmeza_db
      POSTGRES_USER: firmeza_user
      POSTGRES_PASSWORD: FirmezaSecurePassword2026*
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - firmeza-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firmeza_user -d firmeza_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # 3. Servicio REST API (Firmeza.API)
  # Requiere: Tests completados exitosamente y Base de datos lista
  # ==============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: firmeza-api
    restart: unless-stopped
    depends_on:
      tests:
        condition: service_completed_successfully
      firmeza-db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=firmeza-db;Port=5432;Database=firmeza_db;Username=firmeza_user;Password=FirmezaSecurePassword2026*
      - Jwt__Key=Firmeza_Secret_Key_Super_Segura_2026_JWT_Token_Key_Materiales_Key_123456789!
      - Jwt__Issuer=Firmeza.Api
      - Jwt__Audience=Firmeza.ClientApp
      - EmailSettings__SmtpServer=smtp.gmail.com
      - EmailSettings__Port=587
      - EmailSettings__EnableSsl=true
      - EmailSettings__SenderName=FIRMEZA - Materiales
      - EmailSettings__SenderEmail=notificaciones@firmeza.com
      - EmailSettings__IsSimulationMode=true
    ports:
      - "5100:8080"
    volumes:
      - recibos_data:/app/wwwroot/recibos
    networks:
      - firmeza-network

  # ==============================================================================
  # 4. Panel de Administración (Firmeza.Admin - Razor Pages / MVC)
  # Requiere: Tests completados exitosamente, Base de datos lista y API
  # ==============================================================================
  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: firmeza-admin
    restart: unless-stopped
    depends_on:
      tests:
        condition: service_completed_successfully
      firmeza-db:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=firmeza-db;Port=5432;Database=firmeza_db;Username=firmeza_user;Password=FirmezaSecurePassword2026*
      - EmailSettings__IsSimulationMode=true
    ports:
      - "5281:8080"
    volumes:
      - recibos_data:/app/wwwroot/recibos
    networks:
      - firmeza-network

  # ==============================================================================
  # 5. Portal de Clientes (Firmeza.Client - Angular 22 SPA + Nginx)
  # Requiere: Tests completados exitosamente y API iniciada
  # ==============================================================================
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: firmeza-client
    restart: unless-stopped
    depends_on:
      tests:
        condition: service_completed_successfully
      api:
        condition: service_started
    ports:
      - "4200:80"
    networks:
      - firmeza-network

# ==============================================================================
# Redes y Volúmenes Persistentes
# ==============================================================================
networks:
  firmeza-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  recibos_data:
    driver: local
